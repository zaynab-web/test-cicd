name: Mon premier pipeline

on: push

jobs:
  build-et-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build et tests
        run: mvn -B package

  deploy:
    needs: build-et-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Emballer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4